name: Build control image

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/**"
      - "docs/openapi.yaml"
      - "docs/openapi_usage.md"
      - "env.example"
      - "requirements.control.txt"
      - "Dockerfile.control"
      - ".github/workflows/build_control_image.yml"
  workflow_dispatch:

concurrency:
  group: build-control-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-control:
    name: Control plane (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 control image for size check
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/amd64
          pull: true
          load: true
          tags: video-ba-pipe-control:size-check
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control
          provenance: false

      - name: Enforce control image size budget
        run: python3 scripts/check_docker_image_size.py video-ba-pipe-control:size-check --max-mib 1024

      - name: Build and push stable control runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: runtime-base
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-control
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control,mode=max
          provenance: false

      - name: Build and push immutable multi-arch control artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-multiarch-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-control
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control,mode=max
          provenance: false
