name: Build Jetson image

on:
  workflow_dispatch:
    inputs:
      jetson_pytorch_image:
        description: NVIDIA PyTorch iGPU base image
        required: true
        default: nvcr.io/nvidia/pytorch:25.05-py3-igpu
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  build-backend:
    name: Jetson Orin (linux/arm64)
    runs-on: ubuntu-latest
    concurrency:
      group: release-jetson-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space for the NVIDIA base image
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h /

          # The hosted runner contains SDKs that are not used by this Docker
          # build. The Jetson PyTorch base image is large, so remove them before
          # BuildKit starts unpacking ARM64 layers.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          docker image prune --all --force
          docker builder prune --all --force

          echo "Disk usage after cleanup:"
          df -h /

      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable Jetson runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          target: runtime-base
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            JETSON_PYTORCH_IMAGE=${{ inputs.jetson_pytorch_image }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-jetson
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson,mode=max
          provenance: false

      - name: Build immutable Jetson control image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/arm64
          pull: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-jetson-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-jetson
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-jetson,mode=max
          provenance: false

      - name: Enforce Jetson control image size budget
        run: python3 scripts/check_docker_image_size.py ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-jetson-${{ github.sha }} --max-mib 1024

      - name: Push checked Jetson control image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-jetson-${{ github.sha }}

      - name: Build and push Jetson worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            JETSON_PYTORCH_IMAGE=${{ inputs.jetson_pytorch_image }}
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jetson-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.nvidia.jetpack.version=6.2.1
            com.nvidia.l4t.version=36.4.4
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-jetson
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson,mode=max
          provenance: false

      - name: Promote matching Jetson release tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            --tag "${image}:jetson-stable" \
            "${image}:jetson-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${image}:control-jetson-stable" \
            "${image}:control-jetson-${{ github.sha }}"

  build-frontend:
    name: Frontend (linux/arm64)
    needs: build-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.rk
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            BUILDPLATFORM=linux/amd64
            TARGETPLATFORM=linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:arm64
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:arm64-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
