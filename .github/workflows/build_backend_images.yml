name: Build backend images

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/**"
      - "requirements.txt"
      - "requirements.control.txt"
      - "requirements.worker.txt"
      - "requirements.ocr.txt"
      - "Dockerfile.control"
      - "Dockerfile.cpu"
      - ".github/workflows/build_backend_images.yml"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Backend runtime to build"
        required: true
        default: "cpu"
        type: choice
        options:
          - cpu
          - jetson
          - all
      jetson_pytorch_image:
        description: "Jetson only: NVIDIA PyTorch iGPU base image"
        required: false
        default: "nvcr.io/nvidia/pytorch:25.05-py3-igpu"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-cpu:
    name: CPU image (linux/amd64)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.runtime == 'cpu' || inputs.runtime == 'all'
    concurrency:
      group: release-cpu-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable CPU runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          target: runtime-base
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-cpu
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu,mode=max
          provenance: false

      - name: Build immutable CPU control image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/amd64
          pull: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-cpu-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-cpu,mode=max
          provenance: false

      - name: Enforce CPU control image size budget
        run: python3 scripts/check_docker_image_size.py ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-cpu-${{ github.sha }} --max-mib 1024

      - name: Push checked CPU control image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-cpu-${{ github.sha }}

      - name: Build and push CPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-cpu
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cpu,mode=max
          provenance: false

      - name: Promote matching CPU release tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            --tag "${image}:cpu-stable" \
            "${image}:cpu-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${image}:control-cpu-stable" \
            "${image}:control-cpu-${{ github.sha }}"

  build-jetson:
    name: Jetson Orin image (linux/arm64)
    runs-on: ubuntu-latest
    if: inputs.runtime == 'jetson' || inputs.runtime == 'all'
    concurrency:
      group: release-jetson-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable Jetson runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          target: runtime-base
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            JETSON_PYTORCH_IMAGE=${{ inputs.jetson_pytorch_image }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-jetson
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson,mode=max
          provenance: false

      - name: Build immutable Jetson control image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/arm64
          pull: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-jetson-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-jetson
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-jetson,mode=max
          provenance: false

      - name: Enforce Jetson control image size budget
        run: python3 scripts/check_docker_image_size.py ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-jetson-${{ github.sha }} --max-mib 1024

      - name: Push checked Jetson control image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-jetson-${{ github.sha }}

      - name: Build and push Jetson Orin worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            JETSON_PYTORCH_IMAGE=${{ inputs.jetson_pytorch_image }}
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jetson-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.nvidia.jetpack.version=6.2.1
            com.nvidia.l4t.version=36.4.4
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-jetson
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-jetson,mode=max
          provenance: false

      - name: Promote matching Jetson release tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            --tag "${image}:jetson-stable" \
            "${image}:jetson-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${image}:control-jetson-stable" \
            "${image}:control-jetson-${{ github.sha }}"
