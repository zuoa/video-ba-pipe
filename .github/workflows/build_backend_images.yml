name: Build backend images

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "scripts/**"
      - "frontend/package.json"
      - "requirements.txt"
      - "Dockerfile.cpu"
      - ".github/workflows/build_backend_images.yml"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Backend runtime to build"
        required: true
        default: "cpu"
        type: choice
        options:
          - cpu
          - jetson
          - all
      jetson_pytorch_image:
        description: "Jetson only: NVIDIA PyTorch iGPU base image"
        required: false
        default: "nvcr.io/nvidia/pytorch:25.05-py3-igpu"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-cpu:
    name: CPU image (linux/amd64)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.runtime == 'cpu' || inputs.runtime == 'all'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cpu-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-jetson:
    name: Jetson Orin image (linux/arm64)
    runs-on: ubuntu-latest
    if: inputs.runtime == 'jetson' || inputs.runtime == 'all'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Jetson Orin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            JETSON_PYTORCH_IMAGE=${{ inputs.jetson_pytorch_image }}
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jetson
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jetson-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.nvidia.jetpack.version=6.2.1
            com.nvidia.l4t.version=36.4.4
