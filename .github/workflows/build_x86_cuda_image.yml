name: Build X86+CUDA image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend:
    name: X86+CUDA (linux/amd64)
    runs-on: ubuntu-latest
    concurrency:
      group: release-cuda-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space for the CUDA base image
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h /

          # The hosted runner contains SDKs that are not used by this Docker
          # build. The CUDA runtime + PyTorch/Paddle layers are large, so
          # remove them before BuildKit starts unpacking.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          docker image prune --all --force
          docker builder prune --all --force

          echo "Disk usage after cleanup:"
          df -h /

      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable X86+CUDA runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          target: runtime-base
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-cuda
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cuda
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cuda,mode=max
          provenance: false

      - name: Build immutable CUDA control image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/amd64
          pull: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-cuda-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-cuda
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-cuda,mode=max
          provenance: false

      - name: Enforce CUDA control image size budget
        run: python3 scripts/check_docker_image_size.py ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-cuda-${{ github.sha }} --max-mib 1024

      - name: Push checked CUDA control image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-cuda-${{ github.sha }}

      - name: Build and push X86+CUDA worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cuda
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-cuda
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cuda,mode=max
          provenance: false

      - name: Promote matching CUDA release tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            --tag "${image}:cuda-stable" \
            "${image}:cuda-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${image}:control-cuda-stable" \
            "${image}:control-cuda-${{ github.sha }}"
