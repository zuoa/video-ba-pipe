name: Build RKNN image

on:
  workflow_dispatch:
    inputs:
      torch_whl:
        description: "Optional torch wheel URL or path"
        required: false
        default: ""
        type: string
      onnxruntime_whl:
        description: "Optional ONNX Runtime wheel URL or path"
        required: false
        default: ""
        type: string
      ffmpeg_rk_image:
        description: "Optional FFmpeg RK base image"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_FFMPEG_RK_IMAGE: ${{ inputs.ffmpeg_rk_image != '' && inputs.ffmpeg_rk_image || format('ghcr.io/{0}/video-ba-pipe-ffmpeg-rk:rkmpp', github.repository_owner) }}

jobs:
  build-backend:
    name: RK3588 (linux/arm64)
    runs-on: ubuntu-latest
    concurrency:
      group: release-rk-stable
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space for the RK base image
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h /

          # The hosted runner contains SDKs that are not used by this Docker
          # build. Remove them before BuildKit starts unpacking ARM64 layers.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          docker image prune --all --force
          docker builder prune --all --force

          echo "Disk usage after cleanup:"
          df -h /

      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Generate image build information
        id: build_info
        run: python3 scripts/generate_docker_build_info.py >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable RK3588 runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rk
          target: runtime-base
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            TORCH_WHL=${{ inputs.torch_whl }}
            ONNXRUNTIME_WHL=${{ inputs.onnxruntime_whl }}
            FFMPEG_RK_IMAGE=${{ env.DEFAULT_FFMPEG_RK_IMAGE }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-rk
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-rk
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-rk,mode=max
          provenance: false

      - name: Build immutable RK control image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.control
          target: control
          platforms: linux/arm64
          pull: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-rk-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-rk
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-control-rk,mode=max
          provenance: false

      - name: Enforce RK control image size budget
        run: python3 scripts/check_docker_image_size.py ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-rk-${{ github.sha }} --max-mib 1024

      - name: Push checked RK control image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:control-rk-${{ github.sha }}

      - name: Build and push RK3588 worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rk
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            TORCH_WHL=${{ inputs.torch_whl }}
            ONNXRUNTIME_WHL=${{ inputs.onnxruntime_whl }}
            FFMPEG_RK_IMAGE=${{ env.DEFAULT_FFMPEG_RK_IMAGE }}
            APP_VERSION=${{ steps.build_info.outputs.app_version }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rk-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-rk
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-rk
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-rk,mode=max
          provenance: false

      - name: Promote matching RK release tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            --tag "${image}:rk-stable" \
            "${image}:rk-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${image}:control-rk-stable" \
            "${image}:control-rk-${{ github.sha }}"
