name: Build RKNN image

on:
  workflow_dispatch:
    inputs:
      torch_whl:
        description: "Optional torch wheel URL or path"
        required: false
        default: ""
        type: string
      onnxruntime_whl:
        description: "Optional ONNX Runtime wheel URL or path"
        required: false
        default: ""
        type: string
      rknn_toolkit_lite2_whl:
        description: "Optional rknn-toolkit-lite2 wheel URL or path"
        required: false
        default: ""
        type: string
      ffmpeg_rk_image:
        description: "Optional FFmpeg RK base image"
        required: false
        default: ""
        type: string

concurrency:
  group: build-rknn-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_FFMPEG_RK_IMAGE: ${{ inputs.ffmpeg_rk_image != '' && inputs.ffmpeg_rk_image || format('ghcr.io/{0}/video-ba-pipe-ffmpeg-rk:rkmpp', github.repository_owner) }}

jobs:
  build-backend:
    name: RK3588 (linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space for the RK base image
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h /

          # The hosted runner contains SDKs that are not used by this Docker
          # build. Remove them before BuildKit starts unpacking ARM64 layers.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          docker image prune --all --force
          docker builder prune --all --force

          echo "Disk usage after cleanup:"
          df -h /

      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RK3588 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rk
          platforms: linux/arm64
          pull: true
          push: true
          build-args: |
            TORCH_WHL=${{ inputs.torch_whl }}
            ONNXRUNTIME_WHL=${{ inputs.onnxruntime_whl }}
            RKNN_TOOLKIT_LITE2_WHL=${{ inputs.rknn_toolkit_lite2_whl }}
            FFMPEG_RK_IMAGE=${{ env.DEFAULT_FFMPEG_RK_IMAGE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rk
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rk-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
