upstream backend {
    server api:5002;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # 普通上传仍限制为 1 GiB；含模型的模板迁移包使用下方独立的 9 GiB 上限。
    client_max_body_size 1g;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Public media: nginx reads files from the shared /data volume.
    # Existing /api/video/... and /api/image/frames/... URLs keep working;
    # query strings such as ?expires=&signature= are ignored here.
    # ------------------------------------------------------------------
    location /api/video/ {
        alias /data/videos/;
        disable_symlinks on;
        autoindex off;
        gzip off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin *;
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/x-matroska mkv;
            video/quicktime mov;
            video/x-msvideo avi;
            video/x-flv flv;
            video/x-ms-wmv wmv;
        }
        default_type video/mp4;
    }

    location /api/image/frames/ {
        alias /data/frames/;
        disable_symlinks on;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
    }

    location /api/image/snapshots/ {
        alias /data/snapshots/;
        disable_symlinks on;
        autoindex off;
        expires 30s;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
    }

    location /api/image/detection_snapshots/ {
        alias /data/detection_snapshots/;
        disable_symlinks on;
        autoindex off;
        expires 30s;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
    }

    # Public download directory for completed alert-export ZIP files.
    # Path is /media/exports/<task_id>/alerts_export_<id>_<stamp>.zip
    location /media/exports/ {
        alias /data/exports/;
        disable_symlinks on;
        autoindex off;
        gzip off;
        default_type application/zip;
        add_header Content-Disposition "attachment";
        add_header Access-Control-Allow-Origin *;
    }

    # Authenticated download: Flask checks login, then nginx sends the file.
    location /internal/media/exports/ {
        internal;
        alias /data/exports/;
        disable_symlinks on;
        gzip off;
        default_type application/zip;
    }

    # Do not end this prefix with "/". The collection endpoint is
    # /api/alert-exports (without a trailing slash); a slash-terminated
    # proxy location makes nginx redirect it and can drop a published port.
    location /api/alert-exports {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Redirect-Enabled true;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /api/models/import {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /api/workflow-template-imports {
        client_max_body_size 9g;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri /index.html;
    }
}
