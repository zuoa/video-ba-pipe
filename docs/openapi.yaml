openapi: 3.0.3
info:
  title: Video BA Pipe Public API
  version: 1.0.0
  description: 视频源与算法编排的系统级集成接口。API Key 在系统设置中生成。
servers:
  - url: /openapi/v1
security:
  - ApiKeyAuth: []
paths:
  /video-sources:
    post:
      summary: 添加视频源
      operationId: createVideoSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSourceCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /video-sources/{source_code}:
    patch:
      summary: 编辑视频源基本信息和解码参数
      description: source_code 和 source_url 不可通过此接口修改。
      operationId: updateVideoSource
      parameters:
        - $ref: '#/components/parameters/SourceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSourceUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /video-sources/{source_code}/source-url:
    put:
      summary: 更新视频源地址
      description: >-
        更新数据库中的流地址。switch_stream_immediately 默认为 false，当前流继续运行，
        发生断流、无帧或接流失败后才启用新地址；设为 true 时，运行中的 decoder
        会异步重启并立即切换。
      operationId: updateVideoSourceUrl
      parameters:
        - $ref: '#/components/parameters/SourceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_url]
              additionalProperties: false
              properties:
                source_url:
                  type: string
                  minLength: 1
                switch_stream_immediately:
                  type: boolean
                  default: false
                  description: 是否立即切换运行中的视频源；false 表示当前流失效后切换
      responses:
        '200':
          description: 地址未变化，或非运行中视频源已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUrlUpdateResponse'
        '202':
          description: 运行中视频源的地址已更新，已安排立即重载或失效后切换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUrlUpdateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workflow-templates:
    get:
      summary: 查询全部编排模板
      operationId: listWorkflowTemplates
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workflow-activations:
    post:
      summary: 根据视频源编码和模板复制并激活编排
      description: 相同视频源和模板的重复请求会复用并激活已有派生编排。
      operationId: activateWorkflowFromTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_code, template_workflow_id]
              additionalProperties: false
              properties:
                source_code:
                  type: string
                template_workflow_id:
                  type: integer
      responses:
        '200':
          description: 已有派生编排被复用并激活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '201':
          description: 派生编排已创建并激活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workflows:
    get:
      summary: 查询派生编排
      operationId: listWorkflows
      parameters:
        - name: source_code
          in: query
          required: false
          schema:
            type: string
          description: 不传时返回全部非模板编排。
      responses:
        '200':
          description: 编排列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workflows/{workflow_id}/deactivate:
    post:
      summary: 去激活编排
      operationId: deactivateWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 编排已处于未激活状态
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      workflow_id: { type: integer }
                      is_active: { type: boolean, example: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workflows/{workflow_id}/configuration:
    get:
      summary: 查询运行编排入口配置与公共参数
      operationId: getWorkflowConfiguration
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: 组件状态为 configured、missing 或 conflict；公共参数包含节点 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowConfigurationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workflows/{workflow_id}/configuration/time-schedule:
    put:
      summary: 设置入口每周启用时段，缺失时自动补建
      operationId: configureWorkflowTimeSchedule
      description: >-
        无需 node_id。入口顺序固定为视频源、时间、ROI、原下游流程。分支内同类组件、重复组件
        或异常顺序返回 409。dry_run 默认 true；false 才保存。保存成功后 Worker 异步重载，
        同一视频源下其他运行编排也可能短暂中断。
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeScheduleConfigurationRequest' }
      responses:
        '200':
          description: 预检通过或配置已保存；不代表运行实例已经生效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryConfigurationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflows/{workflow_id}/configuration/roi:
    put:
      summary: 设置入口 ROI 区域，缺失时自动补建
      operationId: configureWorkflowRoi
      description: >-
        无需 node_id。整体替换 ROI 列表；空数组清除已有 ROI，组件缺失时不创建空组件、不递增版本。
        dry_run 默认 true。结构冲突返回 409；保存后异步重载，可能影响同源其他编排。
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoiConfigurationRequest' }
      responses:
        '200':
          description: 预检通过或配置已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryConfigurationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflows/batch-config:
    post:
      summary: 预检或原子批量修改运行编排公共参数
      operationId: batchConfigureWorkflows
      description: >-
        通过配置查询获取各编排节点 ID。仅修改明确指定的字段，不创建组件。
        所有目标通过校验和版本检查后统一提交；任一失败整批不写入。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchConfigurationRequest' }
      responses:
        '200':
          description: 预检摘要或提交结果，包含各编排版本号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchConfigurationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SourceCode:
      name: source_code
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数或业务配置无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: API Key 缺失、无效或已禁用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 指定资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源唯一标识冲突、配置版本冲突或入口组件结构冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, example: false }
        code: { type: string, example: invalid_field }
        message: { type: string }
        details:
          type: array
          description: 配置错误详情，可包含 workflow_id、node_id、field、fields、code、error 或 config_version
          items: { type: object }
    VideoSourceCreate:
      type: object
      required: [source_code, name, source_url]
      properties:
        source_code:
          type: string
          maxLength: 255
          pattern: '^[A-Za-z0-9._~-]+$'
        name: { type: string }
        source_url: { type: string }
        enabled: { type: boolean, default: true }
        source_decode_width: { type: integer, minimum: 1, default: 640 }
        source_decode_height: { type: integer, minimum: 1, default: 360 }
        source_fps: { type: integer, minimum: 1, default: 5 }
        source_codec:
          type: string
          enum: [unknown, h264, h265]
          default: unknown
        decode_keyframes_only:
          type: boolean
          nullable: true
          default: null
          description: null 表示继承系统设置，系统默认关闭
    VideoSourceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string }
        enabled: { type: boolean }
        source_decode_width: { type: integer, minimum: 1 }
        source_decode_height: { type: integer, minimum: 1 }
        source_fps: { type: integer, minimum: 1 }
        source_codec:
          type: string
          enum: [unknown, h264, h265]
        decode_keyframes_only:
          type: boolean
          nullable: true
          description: null 表示继承系统设置
    VideoSource:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
        source_code: { type: string }
        source_url: { type: string }
        source_decode_width: { type: integer }
        source_decode_height: { type: integer }
        source_fps: { type: integer }
        source_codec: { type: string }
        decode_keyframes_only: { type: boolean, nullable: true }
        status: { type: string }
    VideoSourceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/VideoSource' }
    SourceUrlUpdateResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            source_code: { type: string }
            source_url: { type: string }
            changed: { type: boolean }
            switch_stream_immediately: { type: boolean }
            stream_switch:
              type: string
              enum: [unchanged, immediate, deferred, next_start]
            reload_scheduled: { type: boolean }
            switch_deferred: { type: boolean }
    Workflow:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        workflow_data: { type: object }
        is_active: { type: boolean }
        is_template: { type: boolean }
        source_template_id: { type: integer, nullable: true }
        source_template_name: { type: string, nullable: true }
        video_source_id: { type: integer, nullable: true }
        source_code: { type: string, nullable: true }
        config_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkflowListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Workflow' }
            total: { type: integer }
    ActivationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            workflow_id: { type: integer }
            template_workflow_id: { type: integer }
            source_code: { type: string }
            created: { type: boolean }
            is_active: { type: boolean, example: true }
    WeeklySchedule:
      type: object
      additionalProperties: false
      required: ['1', '2', '3', '4', '5', '6', '7']
      description: >-
        ISO 星期 1-7，按服务器本地时区。每天允许多个时段或空数组，全周至少一个时段。
        结束分钟包含在内；跨日必须拆分。例如全天为 00:00-23:59。
      properties:
        '1': { $ref: '#/components/schemas/DailyPeriods' }
        '2': { $ref: '#/components/schemas/DailyPeriods' }
        '3': { $ref: '#/components/schemas/DailyPeriods' }
        '4': { $ref: '#/components/schemas/DailyPeriods' }
        '5': { $ref: '#/components/schemas/DailyPeriods' }
        '6': { $ref: '#/components/schemas/DailyPeriods' }
        '7': { $ref: '#/components/schemas/DailyPeriods' }
    DailyPeriods:
      type: array
      items:
        type: object
        required: [start, end]
        properties:
          start: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$', example: '08:00' }
          end: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$', example: '18:00' }
    RoiRegions:
      type: array
      description: 相对原始视频画面的归一化坐标。整体替换，空数组清除区域。
      items:
        type: object
        additionalProperties: false
        required: [name, mode, polygon]
        properties:
          name: { type: string, minLength: 1 }
          mode: { type: string, enum: [pre_mask, crop_infer, post_filter] }
          anchor:
            type: string
            description: 可选目标框判定点，缺失时沿用算法原有规则
            enum: [top_left, top_center, top_right, center_left, center, center_right, bottom_left, bottom_center, bottom_right]
          polygon:
            type: array
            minItems: 3
            description: 至少三个不同顶点且面积非零
            items:
              type: object
              additionalProperties: false
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
    TimeScheduleConfigurationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, weekly_schedule]
      properties:
        expected_version: { type: integer, minimum: 0, description: 查询返回的 config_version }
        dry_run: { type: boolean, default: true }
        weekly_schedule: { $ref: '#/components/schemas/WeeklySchedule' }
    RoiConfigurationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, roi_regions]
      properties:
        expected_version: { type: integer, minimum: 0 }
        dry_run: { type: boolean, default: true }
        roi_regions: { $ref: '#/components/schemas/RoiRegions' }
    WorkflowConfigurationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [workflow_id, config_version, is_active, time_schedule, roi_draw, common_parameters]
          properties:
            workflow_id: { type: integer }
            config_version: { type: integer }
            is_active: { type: boolean }
            time_schedule:
              type: object
              properties:
                status: { type: string, enum: [configured, missing, conflict] }
                node_id: { type: string, nullable: true }
                weekly_schedule: { type: object, nullable: true, description: 存在时结构同 WeeklySchedule }
            roi_draw:
              type: object
              properties:
                status: { type: string, enum: [configured, missing, conflict] }
                node_id: { type: string, nullable: true }
                roi_regions:
                  type: array
                  nullable: true
                  items: { type: object }
                  description: 存在时结构同 RoiRegions
            common_parameters:
              type: array
              items:
                type: object
                required: [node_id, node_type, name, allowed_fields, config]
                properties:
                  node_id: { type: string }
                  node_type: { type: string, enum: [algorithm, alert, time_schedule] }
                  name: { type: string }
                  allowed_fields: { type: array, items: { type: string } }
                  config:
                    type: object
                    description: 当前节点显式配置的公共参数；未显式配置的字段返回 null
    EntryConfigurationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [workflow_id, config_version, dry_run, change, configuration, is_active, message]
          properties:
            workflow_id: { type: integer }
            config_version: { type: integer, description: 预检返回当前版本；提交返回新版本；空 ROI 无操作保持版本 }
            dry_run: { type: boolean }
            is_active: { type: boolean }
            message: { type: string }
            configuration:
              oneOf:
                - $ref: '#/components/schemas/WeeklySchedule'
                - $ref: '#/components/schemas/RoiRegions'
            change:
              type: object
              required: [action, node_type, node_id, connections]
              properties:
                action: { type: string, enum: [created, updated, unchanged] }
                node_type: { type: string, enum: [time_schedule, roi_draw] }
                node_id: { type: string, nullable: true, description: 预检中的新节点 ID 仅供展示，提交时重新生成 }
                fields: { type: array, items: { type: string } }
                connections:
                  type: array
                  items:
                    type: object
                    properties:
                      before: { type: object, nullable: true }
                      after: { type: object }
    AlgorithmChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        confidence: { type: number, minimum: 0, maximum: 1 }
        interval_seconds: { type: number, minimum: 0.1, maximum: 60 }
    AlertChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        trigger_condition:
          type: object
          required: [enable]
          description: enable=true 时 mode、window_size、threshold 必填；count/consecutive 阈值为 1-100 整数，ratio 阈值为 0-1 数值
          properties:
            enable: { type: boolean }
            mode: { type: string, enum: [count, ratio, consecutive] }
            window_size: { type: integer, minimum: 1, maximum: 300 }
            threshold: { type: number, minimum: 0, maximum: 100 }
        suppression:
          type: object
          required: [enable]
          description: enable=true 时 seconds 必填
          properties:
            enable: { type: boolean }
            seconds: { type: integer, minimum: 1, maximum: 3600 }
    TimeScheduleChanges:
      type: object
      additionalProperties: false
      required: [weekly_schedule]
      properties:
        weekly_schedule: { $ref: '#/components/schemas/WeeklySchedule' }
    BatchConfigurationRequest:
      type: object
      additionalProperties: false
      required: [workflow_ids, expected_versions, targets]
      properties:
        workflow_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        expected_versions:
          type: object
          description: 键为 workflow_id 字符串，必须与 workflow_ids 一一对应
          additionalProperties: { type: integer, minimum: 0 }
        dry_run: { type: boolean, default: true }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [workflow_ids, node_id, node_type, changes]
            properties:
              workflow_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items: { type: integer, minimum: 1 }
              node_id: { type: string, minLength: 1 }
              node_type: { type: string, enum: [algorithm, alert, time_schedule] }
              changes:
                oneOf:
                  - $ref: '#/components/schemas/AlgorithmChanges'
                  - $ref: '#/components/schemas/AlertChanges'
                  - $ref: '#/components/schemas/TimeScheduleChanges'
                description: 必须与 node_type 对应；同一编排同一节点只能出现一次
    BatchConfigurationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [dry_run, summary, changes, config_versions, message]
          properties:
            dry_run: { type: boolean }
            message: { type: string }
            config_versions:
              type: object
              description: 预检返回当前版本，提交返回更新后版本
              additionalProperties: { type: integer }
            summary:
              type: object
              properties:
                workflow_count: { type: integer }
                active_count: { type: integer }
                node_change_count: { type: integer }
            changes:
              type: array
              items:
                type: object
                properties:
                  workflow_id: { type: integer }
                  workflow_name: { type: string }
