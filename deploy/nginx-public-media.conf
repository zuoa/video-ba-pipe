# Include this in a host-level nginx (e.g. :9090) when it proxies
# /api/video and export downloads to Flask instead of the frontend
# container. Without these locations, large mp4/zip files go through
# gunicorn and commonly return 502.
#
# Requires the same data volume the API uses, e.g.:
#   ./data/videos  -> /data/videos
#   ./data/frames  -> /data/frames
#   ./data/exports -> /data/exports

location /api/video/ {
    alias /data/videos/;
    disable_symlinks on;
    autoindex off;
    gzip off;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin *;
    default_type video/mp4;
}

location /api/image/frames/ {
    alias /data/frames/;
    disable_symlinks on;
    autoindex off;
    expires 1h;
    add_header Access-Control-Allow-Origin *;
}

location /media/exports/ {
    alias /data/exports/;
    disable_symlinks on;
    autoindex off;
    gzip off;
    default_type application/zip;
    add_header Content-Disposition "attachment";
    add_header Access-Control-Allow-Origin *;
}
