  # MQTT Broker（应用连接参数在系统设置页面配置）
  mqtt:
    image: eclipse-mosquitto:2
    container_name: video-ba-mqtt
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /mosquitto/secrets/initial-password ]; then
          umask 077
          od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /mosquitto/secrets/initial-password
        fi
        mqtt_password="$$(cat /mosquitto/secrets/initial-password)"
        mosquitto_passwd -b -c /mosquitto/secrets/passwd video-ba "$$mqtt_password"
        chmod 600 /mosquitto/secrets/initial-password
        chmod 640 /mosquitto/secrets/passwd
        unset mqtt_password
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-secrets:/mosquitto/secrets
    networks:
      - video-ba-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -u video-ba -P \"$$(cat /mosquitto/secrets/initial-password)\" -t health -m ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
