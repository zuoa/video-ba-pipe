  # MediaMTX 实时预览中继（WebRTC/WHEP 按需拉流）
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: video-ba-mediamtx
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MTX_AUTHINTERNALUSERS_1_USER=${MEDIAMTX_API_USER:-video-ba-api}
      - MTX_AUTHINTERNALUSERS_1_PASS=${MEDIAMTX_API_PASSWORD:-video-ba-api-change-me}
      - MTX_WEBRTCADDITIONALHOSTS=${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-}
    ports:
      - "8889:8889/tcp"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - video-ba-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
